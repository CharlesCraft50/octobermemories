<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Memories - Albums</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Photos are decorative thumbnails: don't select, drag, or invoke image callouts. */
        img {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            user-drag: none;
        }
        /* Disable text selection everywhere without changing hover/animation behavior. */
        body, body * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Click/tap toggle thumbnail spread animations safely contained within bounds */
        .group\/thumb.is-animated > img,
        .group\/thumb.is-animated > div img {
            transform: scale(1.08);
        }
        .group\/thumb.stack-two.is-animated > .stack-card:nth-child(1) {
            transform: translate(2.2rem, -0.8rem) rotate(8deg) scale(1.08) !important;
            z-index: 50 !important;
        }
        .group\/thumb.stack-two.is-animated > .stack-card:nth-child(2) {
            transform: translate(-0.8rem, -0.4rem) rotate(-4deg) scale(1.08) !important;
            z-index: 50 !important;
        }
        .group\/thumb.stack-three.is-animated > .stack-card:nth-child(1) {
            transform: translate(3.5rem, -1rem) rotate(12deg) scale(1.08) !important;
            z-index: 50 !important;
        }
        .group\/thumb.stack-three.is-animated > .stack-card:nth-child(2) {
            transform: translate(1.2rem, -0.6rem) rotate(4deg) scale(1.08) !important;
            z-index: 50 !important;
        }
        .group\/thumb.stack-three.is-animated > .stack-card:nth-child(3) {
            transform: translate(-0.8rem, -0.2rem) rotate(-4deg) scale(1.08) !important;
            z-index: 50 !important;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white relative overflow-x-hidden">

    <!-- Background Photo Collage & Dark Gradient Overlay -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-45">
        <div id="bg-collage" class="absolute inset-0 grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-2 p-2 filter blur-[2px] scale-105">
            <!-- Background tiles injected dynamically -->
        </div>
    </div>
    <div class="fixed inset-0 z-0 bg-gradient-to-br from-zinc-950/80 via-zinc-900/60 to-zinc-950/80 pointer-events-none"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="back-btn" onclick="showHome()" class="hidden p-2 hover:bg-zinc-800 rounded-full transition cursor-pointer text-zinc-400 hover:text-white">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div>
                <h1 id="header-title" class="text-lg sm:text-xl font-semibold tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="images" class="w-5 h-5 text-blue-400"></i>
                    Our Memories
                </h1>
                <p id="header-subtitle" class="text-xs text-zinc-400 mt-0.5">Select a collection</p>
            </div>
        </div>
        <a id="external-btn" href="#" target="_blank" class="hidden bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 text-white text-xs sm:text-sm font-medium px-3 sm:px-4 py-2 rounded-full transition items-center gap-1.5 sm:gap-2 shadow-sm cursor-pointer">
            <i data-lucide="external-link" class="w-4 h-4 text-purple-400"></i>
            <span class="hidden xs:inline">Open Original Link</span>
        </a>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-3 sm:p-6 space-y-8 relative z-10">
        <!-- Home View: Separated Sections -->
        <div id="home-view" class="space-y-8">
            <!-- Photos Section -->
            <section>
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="image" class="w-5 h-5 text-blue-400"></i>
                    <h2 class="text-lg font-semibold text-white tracking-tight">Photo Albums (Oct 1 - Oct 12)</h2>
                </div>
                <div id="photos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                    <!-- Photo cards injected dynamically -->
                </div>
            </section>

            <!-- Videos Section -->
            <section>
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="video" class="w-5 h-5 text-purple-400"></i>
                    <h2 class="text-lg font-semibold text-white tracking-tight">Videos</h2>
                </div>
                <div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                    <!-- Video cards injected dynamically -->
                </div>
            </section>
        </div>

        <!-- Video Player View with Loading Indicator -->
        <div id="embed-view" class="hidden w-full h-[calc(100vh-120px)] flex flex-col">
            <div id="embed-container" class="relative w-full h-full rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900 shadow-2xl">
                <!-- Loading Overlay -->
                <div id="video-loader" class="absolute inset-0 z-10 bg-zinc-950 flex flex-col items-center justify-center gap-3 transition-opacity duration-300">
                    <i data-lucide="loader-2" class="w-8 h-8 text-purple-400 animate-spin"></i>
                    <p class="text-xs text-zinc-400 font-medium">Loading video player...</p>
                </div>
                <!-- Video iframe injected dynamically -->
                <div id="iframe-wrapper" class="w-full h-full"></div>
            </div>
        </div>
    </main>

    <!-- Application Script -->
    <script>
        const photoAlbumsMeta = [
            { id: "oct-01", title: "October 1, 2026", url: "https://photos.app.goo.gl/bR439kkKMZtmy7Pj6", images: ["01.jpg"], tag: "Arrival & First Day", tagStyle: "bg-blue-500/10 text-blue-400 border-blue-500/20", description: "My first day!" },
            { id: "oct-02", title: "October 2, 2026", url: "https://photos.app.goo.gl/dKthpditi5R1HrWc6", images: ["02.JPG", "02.1.JPG"], tag: "Roberto's & Ukay Ukay", tagStyle: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20", description: "Date at Roberto's Siopao — the meatballs and siopao were both good, but the chicken, not so much (which both of us agreed on)! Afterward, we went on an Ukay Ukay spree." },
            { id: "oct-03", title: "October 3, 2026", url: "https://photos.app.goo.gl/rwqwAWCXi7K7phoB9", images: ["03.JPG", "03.1.JPG", "03.2.JPG"], tag: "SM, Sbarro & Dairy Queen", tagStyle: "bg-amber-500/10 text-amber-400 border-amber-500/20", description: "Date in SM, eating at Sbarro and getting treats at Dairy Queen." },
            { id: "oct-04", title: "October 4, 2026", url: "https://photos.app.goo.gl/Mt59KPXZDfPW6aXm6", images: ["04.JPG", "04.1.JPG"], tag: "Guimbal Beach Day", tagStyle: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20", description: "Beach day in Guimbal with family." },
            { id: "oct-05", title: "October 5, 2026", url: "https://photos.app.goo.gl/f5ALgUiSUKSHGcE17", images: ["05.jpg", "05.1.jpg"], tag: "School Visit & Samgyupsal", tagStyle: "bg-pink-500/10 text-pink-400 border-pink-500/20", description: "My first time visiting your school, followed by Samgyupsal with your friends!" },
            { id: "oct-06", title: "October 6, 2026", url: "https://photos.app.goo.gl/RsatsMHHkWbX1x8dA", images: ["06.JPG", "06.1.JPG"], tag: "Baton Search & Tumbler Sprint", tagStyle: "bg-red-500/10 text-red-400 border-red-500/20", description: "Bought a baton downtown because I lost yours, went on a shopping spree for you, and ate Takoyaki. You almost lost your tumbler, but good thing you remembered! We stopped the bus and I ran as fast as I could back to Robinsons." },
            { id: "oct-07", title: "October 7, 2026", url: "https://photos.app.goo.gl/7bN28AzexJsk6K6e6", images: ["07.jpg", "07.1.JPG", "07.2.jpg"], tag: "Majorette, Billiards & Mr. Kimbob", tagStyle: "bg-violet-500/10 text-violet-400 border-violet-500/20", description: "Watched your Majorette performance at school, then at home you taught me your Dalgona recipe! We headed to the mall, planned for archery but it was closed, so we played billiards instead. Strolled through the plaza to SM City Iloilo where you showed me a hangout spot—a park with a row of Heart arcs. Bought donuts for us and your family, and tried Mr. Kimbob! I had the chapchae and beef (sweet!), while you had the kimchi, egg, and beef (perfectly balanced!)." },
            { id: "oct-08", title: "October 8, 2026", url: "https://photos.app.goo.gl/acaQsF8BkEvKmN1o8", images: ["08.JPG", "08.1.JPG", "08.2.JPG"], tag: "Agatona & Archery Fail", tagStyle: "bg-yellow-500/10 text-yellow-400 border-yellow-500/20", description: "Our date at Agatona, one of the finest old restaurants in Iloilo—a super nice place that felt almost like a museum! We ate dinuguan, pancit molo, sausage platter, and halo-halo. Afterward we tried archery, where I sucked (and got a wound the first time trying it)! Bruh, I choked hard and got so self-conscious after that. Maybe next time I'll get it!" },
            { id: "oct-09", title: "October 9, 2026", url: "https://photos.app.goo.gl/hdNuTrbk629GnqX99", images: ["09.jpg", "09.1.jpg", "09.2.jpg"], tag: "Fantasy World with Amanda", tagStyle: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20", description: "Fantasy World with your friend Amanda! So fun and so many things to do—loved the wall climbing and slides. We buried ourselves in balls, rode the 360 bike, and crashed bumper cars into each other!" },
            { id: "oct-10", title: "October 10, 2026", url: "https://photos.app.goo.gl/PNzwmzR699HkQkSv6", images: ["10.jpg", "10.1.jpg", "10.2.jpg"], tag: "Jogging Esplanades & Leche Flan", tagStyle: "bg-teal-500/10 text-teal-400 border-teal-500/20", description: "Morning jog across 3 Esplanades for your upcoming futsal! Took a break near Molo Church to eat famous Pancit Molo and drink caramel iced coffee. Finished at the esplanade near our archery/billiards mall, then walked to buy ingredients for your specialty Leche Flan. Coincidentally bumped into your dad, who gave us a ride back home after shopping!" },
            { id: "oct-11", title: "October 11, 2026", url: "https://photos.app.goo.gl/H6CTx9Jc9BjZBpzx9", images: ["11.jpg", "11.1.jpg", "11.2.jpg"], tag: "Port Carinderia & Evening Mass", tagStyle: "bg-orange-500/10 text-orange-400 border-orange-500/20", description: "Family lunch date! Found a turo-turo carinderia right before the port with a beautiful view where we ate clams and chosen dishes. Stopped by Biscocho Haus for pasalubong—I tried giving money to your family for picking it out, but they refused. I'm so grateful! Went to church at night with family and your friend Evita, where I prayed for a safe flight." },
            { id: "oct-12", title: "October 12, 2026", url: "https://photos.app.goo.gl/HiMd3KbTeUnH1YXk7", images: ["12.jpg", "12.1.jpg", "12.2.jpg"], tag: "Karaoke, 48 Coffee & Atchara Clutch", tagStyle: "bg-rose-500/10 text-rose-400 border-rose-500/20", description: "Last day! Went to Robinsons Jaro for Karaoke with Amanda and her boyfriend Robert, followed by Chowking. For our final night date, we went to 48 Coffee where I tried their good Dirty Matcha. Unforgettable airport goodbyes! Almost had to discard your mom's atchara because of plane rules, but rushed back to my luggage and managed to fit all 3 containers into ziplock bags and waterproof pouches just in time for the final boarding call!" }
        ];

        const videoAlbumsMeta = [
            { title: "October 4, 2026", images: ["04.JPG", "04.1.JPG"], tag: "Beach Memories", tagStyle: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20", url: "https://u.pcloud.link/publink/show?code=kZ21QbJZnla0oYHGbVfOaGU1VwnDkjeyDgT7" },
            { title: "October 7, 2026 (Part 1)", images: ["07.1.JPG", "07.jpg"], tag: "Majorette Performance", tagStyle: "bg-violet-500/10 text-violet-400 border-violet-500/20", url: "https://u.pcloud.link/publink/show?code=kZYDQbJZ0XKrjkA2Vi8UAzNdrkq4Nbl0EB5k" },
            { title: "October 7, 2026 (Part 2)", images: ["07.2.jpg", "07.jpg"], tag: "Dalgona & Plaza Stroll", tagStyle: "bg-violet-500/10 text-violet-400 border-violet-500/20", url: "https://u.pcloud.link/publink/show?code=kZYDQbJZ0XKrjkA2Vi8UAzNdrkq4Nbl0EB5k" },
            { title: "October 8, 2026", images: ["08.JPG", "08.1.JPG"], tag: "Agatona & Archery", tagStyle: "bg-yellow-500/10 text-yellow-400 border-yellow-500/20", url: "https://u.pcloud.link/publink/show?code=kZmDQbJZ568dgew6sJjRaTrWt3bxIXJDtWQk" },
            { title: "October 9, 2026 (Part 1)", images: ["09.1.jpg", "09.jpg"], tag: "Fantasy World Fun", tagStyle: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20", url: "https://u.pcloud.link/publink/show?code=kZbDQbJZijwGSRpOSfmpGuQby8AHRXL2tfFk" },
            { title: "October 9, 2026 (Part 2)", images: ["09.2.jpg", "09.jpg"], tag: "Bumper Cars & Bike", tagStyle: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20", url: "https://u.pcloud.link/publink/show?code=kZ91QbJZ5o52S8cNbNJSoS19pT3sT02hBf0k" },
            { title: "October 10, 2026", images: ["10.jpg", "10.1.jpg"], tag: "Morning Jog & Molo", tagStyle: "bg-teal-500/10 text-teal-400 border-teal-500/20", url: "https://u.pcloud.link/publink/show?code=kZr1QbJZNbNEhMJfhl4tpwQ2YH0vbz5UIKSy" },
            { title: "October 12, 2026", images: ["12.jpg", "12.1.jpg"], tag: "Karaoke & Farewell", tagStyle: "bg-rose-500/10 text-rose-400 border-rose-500/20", url: "https://u.pcloud.link/publink/show?code=kZo1QbJZl3tuH506ixFTqclCxoSiKQIdpslX" }
        ];

        function initApp() {
            const collageContainer = document.getElementById('bg-collage');
            const sampleImages = [
                'img/01.jpg', 'img/02.JPG', 'img/03.JPG', 
                'img/04.JPG', 'img/05.jpg', 'img/06.JPG', 
                'img/07.1.JPG', 'img/07.2.jpg', 'img/08.JPG', 
                'img/09.1.jpg', 'img/09.2.jpg', 'img/10.jpg', 
                'img/11.jpg', 'img/12.jpg'
            ];
            
            collageContainer.innerHTML = sampleImages.map(imgUrl => `
                <div class="aspect-square overflow-hidden rounded-lg opacity-65 shadow-inner">
                    <img src="${imgUrl}" alt="" draggable="false" onerror="this.parentElement.style.display='none'" class="w-full h-full object-cover" />
                </div>
            `).join('');

            renderHome();
        }

        // Viewport-Contained Smooth Thumbnail Deck Builder
        function renderStackedThumbnailHTML(imgArray, overlayIconHTML = '') {
            if (!imgArray || imgArray.length === 0) return '';
            
            if (imgArray.length === 1) {
                return `
                    <div class="w-full h-44 sm:h-52 rounded-xl bg-zinc-950 overflow-hidden border border-zinc-700/80 relative shadow-xl group/thumb cursor-pointer" onclick="toggleThumbnailAnimation(event, this)">
                        <img src="img/${imgArray[0]}" alt="" draggable="false" class="w-full h-full object-cover group-hover/thumb:scale-105 transition-all duration-300 ease-out">
                        ${overlayIconHTML}
                    </div>
                `;
            } else if (imgArray.length === 2) {
                return `
                    <div class="w-full h-44 sm:h-52 relative flex-shrink-0 cursor-pointer group/thumb stack-two py-2 overflow-hidden rounded-xl" onclick="toggleThumbnailAnimation(event, this)">
                        <!-- Back Stacked Card -->
                        <div class="stack-card absolute top-2 left-10 w-[72%] h-36 sm:h-44 rounded-xl bg-zinc-900 border border-zinc-500 overflow-hidden shadow-2xl transform rotate-6 z-10 hover:!z-50 hover:!scale-110 transition-all duration-300 ease-out">
                            <img src="img/${imgArray[1]}" alt="" draggable="false" class="w-full h-full object-cover">
                        </div>
                        <!-- Front Main Card -->
                        <div class="stack-card absolute top-2 left-4 w-[72%] h-36 sm:h-44 rounded-xl bg-zinc-950 border border-zinc-500 overflow-hidden shadow-2xl z-20 hover:!z-50 hover:!scale-110 transition-all duration-300 ease-out">
                            <img src="img/${imgArray[0]}" alt="" draggable="false" class="w-full h-full object-cover">
                            ${overlayIconHTML}
                        </div>
                    </div>
                `;
            } else {
                // 3 stacked cards safely contained within bounds
                return `
                    <div class="w-full h-44 sm:h-52 relative flex-shrink-0 cursor-pointer group/thumb stack-three py-2 overflow-hidden rounded-xl" onclick="toggleThumbnailAnimation(event, this)">
                        <!-- 3rd Back Card -->
                        <div class="stack-card absolute top-2 left-14 w-[65%] h-36 sm:h-44 rounded-xl bg-zinc-900 border border-zinc-500 overflow-hidden shadow-xl transform rotate-12 z-10 hover:!z-50 hover:!scale-110 transition-all duration-300 ease-out">
                            <img src="img/${imgArray[2]}" alt="" draggable="false" class="w-full h-full object-cover">
                        </div>
                        <!-- 2nd Middle Card -->
                        <div class="stack-card absolute top-2 left-7 w-[65%] h-36 sm:h-44 rounded-xl bg-zinc-900 border border-zinc-500 overflow-hidden shadow-2xl transform rotate-6 z-20 hover:!z-50 hover:!scale-110 transition-all duration-300 ease-out">
                            <img src="img/${imgArray[1]}" alt="" draggable="false" class="w-full h-full object-cover">
                        </div>
                        <!-- 1st Front Card -->
                        <div class="stack-card absolute top-2 left-0 w-[65%] h-36 sm:h-44 rounded-xl bg-zinc-950 border border-zinc-500 overflow-hidden shadow-2xl z-30 hover:!z-50 hover:!scale-110 transition-all duration-300 ease-out">
                            <img src="img/${imgArray[0]}" alt="" draggable="false" class="w-full h-full object-cover">
                            ${overlayIconHTML}
                        </div>
                    </div>
                `;
            }
        }

        function toggleThumbnailAnimation(event, thumbnail) {
            event.preventDefault();
            event.stopPropagation();
            thumbnail.classList.toggle('is-animated');
        }

        function renderHome() {
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('external-btn').classList.add('hidden');
            document.getElementById('external-btn').classList.remove('flex');
            document.getElementById('header-title').innerHTML = `<i data-lucide="images" class="w-5 h-5 text-blue-400"></i> Our Memories`;
            document.getElementById('header-subtitle').textContent = "Select a collection";

            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('embed-view').classList.add('hidden');

            // Render Photos Cards
            const photosContainer = document.getElementById('photos-grid');
            photosContainer.innerHTML = '';
            photoAlbumsMeta.forEach(album => {
                const thumbHTML = renderStackedThumbnailHTML(album.images);
                const card = document.createElement('div');
                card.className = "bg-zinc-900/90 backdrop-blur-md border border-zinc-800 rounded-2xl overflow-hidden hover:border-blue-500/60 transition-all shadow-xl flex flex-col p-4 sm:p-5 gap-4 relative group select-none";
                const detailsLink = document.createElement('a');
                detailsLink.href = album.url;
                detailsLink.target = "_blank";
                detailsLink.rel = "noopener noreferrer";
                detailsLink.setAttribute('aria-label', `Open photo album: ${album.title}`);
                detailsLink.className = "block rounded-lg no-underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400";
                detailsLink.innerHTML = `
                    <div class="flex items-start justify-between gap-3 mt-1">
                        <div class="min-w-0">
                            <h3 class="font-bold text-white tracking-tight text-base sm:text-lg">${album.title}</h3>
                            <span class="inline-block mt-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${album.tagStyle}">
                                ${album.tag}
                            </span>
                        </div>
                        <i data-lucide="external-link" class="w-4 h-4 text-zinc-400 flex-shrink-0 mt-1"></i>
                    </div>
                    <p class="text-xs sm:text-sm text-zinc-300 leading-relaxed border-t border-zinc-800/80 pt-3 mt-3">
                        ${album.description}
                    </p>
                `;
                card.innerHTML = thumbHTML;
                card.appendChild(detailsLink);
                photosContainer.appendChild(card);
            });

            // Render Videos Cards
            const videosContainer = document.getElementById('videos-grid');
            videosContainer.innerHTML = '';
            videoAlbumsMeta.forEach(album => {
                const playOverlay = `
                    <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-full bg-purple-600/90 text-white flex items-center justify-center shadow-lg group-hover/thumb:scale-105 transition-transform">
                            <i data-lucide="play" class="w-6 h-6 fill-white ml-0.5"></i>
                        </div>
                    </div>
                `;
                const thumbHTML = renderStackedThumbnailHTML(album.images, playOverlay);
                const card = document.createElement('div');
                card.className = "bg-zinc-900/90 backdrop-blur-md border border-zinc-800 rounded-2xl overflow-hidden hover:border-purple-500/60 transition-all shadow-xl flex flex-col p-4 sm:p-5 gap-4 relative group cursor-pointer";
                card.onclick = () => openVideoPlayer(album.title, album.url);
                card.innerHTML = `
                    ${thumbHTML}
                    <div class="flex items-start justify-between gap-3 mt-1">
                        <div class="min-w-0">
                            <h3 class="font-bold text-white tracking-tight text-base sm:text-lg truncate">${album.title}</h3>
                            <span class="inline-block mt-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${album.tagStyle}">
                                ${album.tag}
                            </span>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-zinc-400 group-hover:text-white transition flex-shrink-0 mt-1"></i>
                    </div>
                `;
                videosContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        function openVideoPlayer(title, url) {
            document.getElementById('back-btn').classList.remove('hidden');
            
            const extBtn = document.getElementById('external-btn');
            extBtn.href = url;
            extBtn.classList.remove('hidden');
            extBtn.classList.add('flex');

            document.getElementById('header-title').innerHTML = `<i data-lucide="video" class="w-5 h-5 text-purple-400"></i> ${title}`;
            document.getElementById('header-subtitle').textContent = 'pCloud Video';

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('embed-view').classList.remove('hidden');

            const loader = document.getElementById('video-loader');
            const wrapper = document.getElementById('iframe-wrapper');

            loader.classList.remove('opacity-0', 'pointer-events-none');
            wrapper.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.className = "w-full h-full border-0 bg-zinc-950";
            iframe.allow = "autoplay; encrypted-media";
            iframe.setAttribute('allowfullscreen', '');

            iframe.onload = () => {
                loader.classList.add('opacity-0', 'pointer-events-none');
            };

            wrapper.appendChild(iframe);
            lucide.createIcons();
        }

        function showHome() {
            document.getElementById('iframe-wrapper').innerHTML = '';
            renderHome();
        }

        initApp();
    </script>
</body>
</html>
